<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아이언핏 GYM - 트레이너 관리</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ── 통계 카드 ── */
    .trainer-stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.25rem;
      margin-bottom: 1.75rem;
    }
    .t-stat-card {
      background: var(--bg-card);
      border-radius: 14px;
      padding: 1.25rem 1.5rem;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .t-stat-icon {
      width: 48px; height: 48px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; flex-shrink: 0;
    }
    .t-stat-label { font-size: 0.78rem; color: var(--color-text-muted); font-weight: 600; margin-bottom: 0.25rem; }
    .t-stat-value { font-size: 1.6rem; font-weight: 800; font-family: var(--font-en); line-height: 1; }
    .t-stat-sub   { font-size: 0.72rem; color: var(--color-text-muted); margin-top: 0.2rem; }

    /* ── 오늘의 수업 ── */
    .today-sessions-wrap {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      padding: 0.25rem 0 0.5rem;
    }
    .today-session-card {
      background: linear-gradient(135deg, #F0FDF4, #DCFCE7);
      border: 1.5px solid #86EFAC;
      border-radius: 12px;
      padding: 0.9rem 1.1rem;
      display: flex;
      align-items: center;
      gap: 0.9rem;
      min-width: 220px;
      flex: 1;
      max-width: 300px;
    }
    .today-session-card.done {
      background: #F9FAFB;
      border-color: var(--border-color);
      opacity: 0.7;
    }
    .session-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--color-success);
      color: #FFF;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; font-weight: 800;
      flex-shrink: 0;
    }
    .today-session-card.done .session-avatar { background: var(--color-text-muted); }
    .attend-btn {
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      border: none;
      background: var(--color-success);
      color: #FFF;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      display: flex; align-items: center; gap: 0.3rem;
      transition: all var(--transition-fast);
      margin-left: auto;
    }
    .attend-btn:hover { background: #16A34A; transform: scale(1.04); }
    .attend-btn.done {
      background: var(--color-text-muted);
      cursor: default;
      transform: none;
    }
    .no-today-msg {
      padding: 1rem 0;
      color: var(--color-text-muted);
      font-size: 0.9rem;
    }

    /* ── 주간 일정 그리드 ── */
    .weekly-grid-outer {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }
    .weekly-grid {
      min-width: 620px;
      width: 100%;
      border-collapse: collapse;
    }
    .weekly-grid th, .weekly-grid td {
      border: 1px solid var(--border-color);
      padding: 0;
      text-align: center;
    }
    .wg-time-head {
      background: var(--bg-secondary);
      font-size: 0.72rem;
      color: var(--color-text-muted);
      padding: 0.5rem 0.75rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .wg-day-head {
      background: var(--bg-secondary);
      padding: 0.6rem 0.5rem;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--color-text-muted);
    }
    .wg-day-head.is-today {
      background: rgba(232,89,60,0.08);
      color: var(--color-primary);
    }
    .wg-day-head .day-date { font-size: 0.68rem; font-weight: 400; opacity: 0.7; display: block; margin-top: 0.1rem; }
    .wg-cell {
      height: 52px;
      vertical-align: middle;
      padding: 4px;
    }
    .wg-cell.today-col { background: rgba(232,89,60,0.03); }
    .wg-cell.empty     { background: transparent; }
    .wg-session {
      background: linear-gradient(135deg, #EEF2FF, #E0E7FF);
      border: 1.5px solid #A5B4FC;
      border-radius: 8px;
      padding: 0.3rem 0.5rem;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.15s;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }
    .wg-session:hover { transform: scale(1.03); box-shadow: 0 2px 8px rgba(99,102,241,0.2); }
    .wg-session.today-session {
      background: linear-gradient(135deg, #FFF7ED, #FFEDD5);
      border-color: var(--color-primary);
    }
    .wg-session .s-name  { font-weight: 700; color: #3730A3; }
    .wg-session.today-session .s-name { color: var(--color-primary); }
    .wg-session .s-time  { font-size: 0.65rem; color: #6366F1; opacity: 0.8; }
    .wg-session.today-session .s-time { color: #C2410C; }
    .wg-time-label { font-size: 0.72rem; color: var(--color-text-muted); font-weight: 600; padding: 0.5rem 0.75rem; font-family: var(--font-en); white-space: nowrap; }

    /* ── PT 신청 대기 알람 ── */
    .pt-alarm-badge {
      background: var(--color-danger);
      color: #FFF;
      font-size: 0.72rem;
      font-weight: 700;
      border-radius: 99px;
      padding: 0.15rem 0.55rem;
      margin-left: 0.5rem;
    }
    .pt-request-item {
      background: #FFF7ED;
      border: 1.5px solid #FED7AA;
      border-radius: 10px;
      padding: 0.85rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      min-width: 220px;
      flex: 1;
      max-width: 320px;
    }
    .pt-req-name { font-weight: 700; font-size: 0.92rem; }
    .pt-req-meta { font-size: 0.78rem; color: var(--color-text-muted); line-height: 1.5; }
    .pt-request-actions { display: flex; gap: 0.5rem; margin-top: 0.25rem; }
    .pt-request-actions button {
      flex: 1; padding: 0.4rem 0; border-radius: 8px; border: none;
      font-weight: 700; font-size: 0.82rem; cursor: pointer;
      transition: all var(--transition-fast);
    }
    .pt-request-actions button:disabled { opacity: 0.5; cursor: default; }
    .btn-approve { background: var(--color-success); color: #FFF; }
    .btn-approve:hover:not(:disabled) { background: #16A34A; }
    .btn-reject  { background: var(--color-danger); color: #FFF; }
    .btn-reject:hover:not(:disabled) { background: #DC2626; }

    /* ── 담당 회원 테이블 ── */
    .member-progress-bar {
      height: 6px;
      background: var(--bg-secondary);
      border-radius: 99px;
      overflow: hidden;
      width: 100px;
      display: inline-block;
      vertical-align: middle;
      margin-right: 0.4rem;
    }
    .member-progress-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--color-primary), #FF7E67); }
    .member-name-btn {
      display: flex; align-items: center; gap: 0.5rem;
      cursor: pointer; background: none; border: none; padding: 0;
      text-align: left;
    }
    .member-avatar-sm {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; font-weight: 800;
      flex-shrink: 0;
    }

    /* ── 회원 상세 모달 ── */
    .member-modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 10000;
      display: flex; align-items: center; justify-content: center;
      padding: 1rem;
    }
    .member-modal {
      background: var(--bg-card);
      border-radius: 20px;
      width: 100%; max-width: 760px;
      max-height: 90vh;
      display: flex; flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,0.45);
      animation: slideDown 0.28s ease-out;
    }
    .member-modal-header {
      background: linear-gradient(135deg, var(--bg-secondary), #1E2347);
      padding: 1.2rem 1.5rem;
      display: flex; align-items: center; gap: 1rem;
      border-bottom: 1px solid var(--border-color-dark);
      flex-shrink: 0;
    }
    .member-modal-avatar {
      width: 48px; height: 48px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; font-weight: 800;
      flex-shrink: 0;
    }
    .member-modal-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    .detail-tab-bar {
      display: flex;
      border-bottom: 2px solid var(--border-color);
      padding: 0 1.5rem;
      background: var(--bg-card);
      flex-shrink: 0;
    }
    .detail-tab-btn {
      padding: 0.75rem 1rem;
      font-size: 0.85rem; font-weight: 600;
      color: var(--color-text-muted);
      border: none; background: none; cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all var(--transition-fast);
    }
    .detail-tab-btn.active { color: var(--color-primary); border-bottom-color: var(--color-primary); }
    .detail-tab-btn:hover { color: var(--color-primary); }
    .detail-tab-content { padding: 1.25rem 1.5rem; flex: 1; overflow-y: auto; }

    /* 코멘트 */
    .comment-item {
      padding: 0.75rem 1rem;
      background: #F9FAFB;
      border-radius: 10px;
      border-left: 3px solid var(--color-primary);
      margin-bottom: 0.75rem;
      font-size: 0.88rem;
    }
    .comment-date { font-size: 0.72rem; color: var(--color-text-muted); margin-bottom: 0.25rem; }

    /* ── PT 계약 등록 모달 (라이트 테마) ── */
    .approval-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 20000;
      display: flex; align-items: center; justify-content: center;
      padding: 1rem;
    }
    .approval-modal {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      width: 100%; max-width: 500px;
      max-height: 92vh; overflow-y: auto;
      padding: 1.75rem;
      box-shadow: 0 24px 64px rgba(0,0,0,0.25);
      animation: slideDown 0.25s ease-out;
    }
    .approval-modal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.25rem;
    }
    .approval-modal-title { font-size: 1rem; font-weight: 800; color: var(--color-text-dark); }
    .approval-info-box {
      background: #F9FAFB;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      margin-bottom: 1.25rem;
      display: flex; gap: 2rem;
    }
    .approval-info-label { font-size: 0.72rem; color: var(--color-text-muted); margin-bottom: 0.2rem; }
    .approval-info-value { font-weight: 700; font-size: 0.95rem; color: var(--color-text-dark); }
    .approval-form-group { margin-bottom: 1rem; }
    .approval-form-label {
      font-size: 0.8rem; font-weight: 600; color: var(--color-text-muted);
      display: block; margin-bottom: 0.4rem;
    }
    .approval-form-label .required { color: var(--color-danger); margin-left: 2px; }
    .approval-input {
      background: #FFF; border: 1px solid var(--border-color);
      border-radius: 8px; color: var(--color-text-dark);
      font-size: 0.88rem; padding: 0.6rem 0.9rem;
      width: 100%; box-sizing: border-box;
      outline: none; transition: border-color 0.2s;
    }
    .approval-input:focus { border-color: var(--color-primary); }
    .session-preset-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .session-preset-btn {
      padding: 0.45rem 1rem; border-radius: 8px;
      border: 1.5px solid var(--border-color);
      background: transparent; color: var(--color-text-muted);
      font-size: 0.82rem; font-weight: 700; cursor: pointer;
      transition: all 0.15s;
    }
    .session-preset-btn.active,
    .session-preset-btn:hover {
      border-color: var(--color-primary);
      background: rgba(232,89,60,0.08);
      color: var(--color-primary);
    }
    .session-preset-input {
      width: 90px; border: 1px solid var(--border-color);
      border-radius: 8px; font-size: 0.82rem;
      padding: 0.45rem 0.75rem; outline: none;
      background: #FFF; color: var(--color-text-dark);
    }
    .day-toggle-group { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .day-toggle { cursor: pointer; }
    .day-toggle input[type="checkbox"] { display: none; }
    .day-toggle span {
      display: inline-flex; align-items: center; justify-content: center;
      width: 34px; height: 34px; border-radius: 50%;
      border: 1.5px solid var(--border-color);
      font-size: 0.8rem; font-weight: 700;
      color: var(--color-text-muted);
      transition: all 0.15s;
    }
    .day-toggle input:checked + span {
      background: var(--color-primary); color: #FFF;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(232,89,60,0.18);
    }
    .approval-modal-footer {
      display: flex; gap: 0.75rem; justify-content: flex-end;
      margin-top: 1.5rem; padding-top: 1.25rem;
      border-top: 1px solid var(--border-color);
    }
    .approval-cancel-btn {
      padding: 0.6rem 1.25rem; border-radius: 8px;
      border: 1px solid var(--border-color);
      background: transparent; color: var(--color-text-muted);
      font-size: 0.88rem; font-weight: 600; cursor: pointer;
    }
    .approval-submit-btn {
      padding: 0.6rem 1.5rem; border-radius: 8px;
      border: none; background: var(--color-primary); color: #FFF;
      font-size: 0.88rem; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; gap: 0.4rem;
      transition: opacity 0.2s;
    }
    .approval-submit-btn:disabled { opacity: 0.5; cursor: default; }

    @media (max-width: 1024px) {
      .trainer-stat-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 768px) {
      .trainer-stat-grid { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
      .member-modal { max-height: 95vh; border-radius: 16px 16px 0 0; align-self: flex-end; }
      .member-modal-backdrop { align-items: flex-end; padding: 0; }
    }
  </style>
</head>
<body>
<div class="app-container">

  <!-- ── 사이드바 ── -->
  <aside class="sidebar" id="appSidebar">
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-icon"><i class="fa-solid fa-dumbbell"></i></span>
        <span class="logo-text">IRONFIT <span class="logo-highlight">GYM</span></span>
      </div>
    </div>
    <div class="sidebar-body">
      <ul class="nav-list">
        <li class="nav-item"><a href="dashboard.html"><i class="fa-solid fa-chart-line"></i><span>대시보드</span></a></li>
        <li class="nav-item"><a href="workout.html"><i class="fa-solid fa-calendar-check"></i><span>운동 기록</span></a></li>
        <li class="nav-item"><a href="body.html"><i class="fa-solid fa-weight-scale"></i><span>신체 변화</span></a></li>
        <li class="nav-item"><a href="diet.html"><i class="fa-solid fa-utensils"></i><span>식단 기록</span></a></li>
        <li class="nav-item"><a href="equipment.html"><i class="fa-solid fa-circle-info"></i><span>기구 사용법</span></a></li>
        <li class="nav-item"><a href="pt.html"><i class="fa-solid fa-handshake"></i><span>PT 신청·일정</span></a></li>
        <li class="nav-item active role-trainer"><a href="trainer.html" style="border-left:3px solid var(--color-primary);"><i class="fa-solid fa-user-gear"></i><span>트레이너 관리</span></a></li>
        <li class="nav-item role-admin" style="display:none;"><a href="admin.html" style="border-left:3px solid var(--color-primary);"><i class="fa-solid fa-screwdriver-wrench"></i><span>시스템 관리자</span></a></li>
      </ul>
    </div>
    <div class="sidebar-footer">
      <div class="user-profile">
        <div class="user-avatar" id="userAvatar">T</div>
        <div class="user-info">
          <div class="user-name" id="profileName">트레이너</div>
          <div class="user-role" id="profileRole">트레이너</div>
        </div>
        <button class="btn-logout" id="logoutBtn" title="로그아웃">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ── 메인 콘텐츠 ── -->
  <div class="main-content">
    <header class="main-header">
      <div class="header-title">
        <i class="fa-solid fa-bars hamburger-btn" id="menuToggle"></i>
        <span>트레이너 관리</span>
      </div>
      <div class="header-actions">
        <span class="badge badge-primary" id="trainerBadge">트레이너</span>
      </div>
    </header>

    <main class="page-body">

      <!-- PT 신청 대기 알람 -->
      <section class="card" id="ptAlarmCard" style="margin-bottom:1.75rem;">
        <div class="card-header">
          <h3 class="card-title">
            <i class="fa-solid fa-bell" style="color:var(--color-danger);"></i>
            PT 신청 대기 중
            <span class="pt-alarm-badge" id="ptAlarmBadge" style="display:none;">0</span>
          </h3>
        </div>
        <div class="card-body">
          <div id="ptRequestList" style="display:flex; flex-wrap:wrap; gap:0.75rem;"></div>
        </div>
      </section>

      <!-- 통계 카드 -->
      <div class="trainer-stat-grid" id="statGrid"></div>

      <!-- 오늘의 수업 -->
      <section class="card" style="margin-bottom:1.75rem;">
        <div class="card-header">
          <h3 class="card-title">
            <i class="fa-solid fa-sun" style="color:var(--color-warning);"></i>
            오늘의 수업
          </h3>
          <span class="badge badge-warning" id="todayCountBadge">0건</span>
        </div>
        <div class="card-body">
          <div class="today-sessions-wrap" id="todaySessionsWrap"></div>
        </div>
      </section>

      <!-- 주간 PT 일정 -->
      <section class="card" style="margin-bottom:1.75rem;">
        <div class="card-header">
          <h3 class="card-title">
            <i class="fa-solid fa-calendar-week" style="color:var(--color-primary);"></i>
            이번 주 PT 일정
          </h3>
          <span class="badge badge-primary" id="weeklyCountBadge">0회</span>
        </div>
        <div class="card-body" style="padding-top:0.5rem;">
          <div class="weekly-grid-outer">
            <table class="weekly-grid" id="weeklyGrid"></table>
          </div>
        </div>
      </section>

      <!-- 담당 회원 -->
      <section class="card" style="margin-bottom:1.75rem;">
        <div class="card-header">
          <h3 class="card-title">
            <i class="fa-solid fa-users" style="color:var(--color-info);"></i>
            담당 회원 관리
          </h3>
          <span class="badge badge-info" id="memberCountBadge">0명</span>
        </div>
        <div class="card-body" style="padding:0;">
          <div class="table-wrap">
            <table class="table" id="memberTable">
              <thead>
                <tr>
                  <th>회원명</th>
                  <th>수업 요일·시간</th>
                  <th>세션 진행도</th>
                  <th>출석률</th>
                  <th>마지막 운동일</th>
                  <th>관리</th>
                </tr>
              </thead>
              <tbody id="memberTableBody"></tbody>
            </table>
          </div>
        </div>
      </section>

    </main>
  </div>
</div>

<!-- ── 회원 상세 모달 ── -->
<div id="memberModalBackdrop" class="member-modal-backdrop" style="display:none;" onclick="handleMemberModalBackdrop(event)">
  <div class="member-modal" onclick="event.stopPropagation()">

    <div class="member-modal-header">
      <div class="member-modal-avatar" id="detailAvatar" style="background:#E8F0FE; color:var(--color-info);">H</div>
      <div style="flex:1;">
        <div style="font-size:1rem; font-weight:800; color:#FFF;" id="detailName">회원명</div>
        <div style="font-size:0.8rem; color:rgba(255,255,255,0.6);" id="detailInfo">PT 회원</div>
      </div>
      <button class="btn btn-sm" style="background:rgba(255,255,255,0.1); color:#FFF;" onclick="closeMemberModal()">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="member-modal-body">
      <div class="detail-tab-bar">
        <button class="detail-tab-btn active" onclick="switchDetailTab(this,'workout')">
          <i class="fa-solid fa-dumbbell"></i> 운동기록
        </button>
        <button class="detail-tab-btn" onclick="switchDetailTab(this,'body')">
          <i class="fa-solid fa-weight-scale"></i> 신체변화
        </button>
        <button class="detail-tab-btn" onclick="switchDetailTab(this,'diet')">
          <i class="fa-solid fa-utensils"></i> 식단
        </button>
        <button class="detail-tab-btn" onclick="switchDetailTab(this,'comment')">
          <i class="fa-solid fa-comment-dots"></i> 코멘트
        </button>
      </div>
      <div class="detail-tab-content" id="detailTabContent">
        <div style="text-align:center; padding:2rem; color:var(--color-text-muted);">
          <i class="fa-solid fa-spinner fa-spin"></i> 불러오는 중...
        </div>
      </div>
    </div>

  </div>
</div>

<!-- 로딩 오버레이 -->
<div class="loading-overlay">
  <div class="spinner"></div>
  <div class="loading-text">트레이너 정보 불러오는 중...</div>
</div>

<!-- PT 계약 등록 모달 -->
<div id="trainerApprovalBackdrop" class="approval-backdrop" style="display:none" onclick="handleApprovalBackdrop(event)">
  <div class="approval-modal">
    <div class="approval-modal-header">
      <span class="approval-modal-title">PT 계약 등록</span>
      <button class="close-btn" onclick="closeApprovalModal()" style="background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--color-text-muted);">×</button>
    </div>
    <div class="approval-info-box">
      <div class="approval-info-item">
        <div class="approval-info-label">회원명</div>
        <div class="approval-info-value" id="approvalMemberName">—</div>
      </div>
      <div class="approval-info-item">
        <div class="approval-info-label">트레이너</div>
        <div class="approval-info-value" id="approvalTrainerName">—</div>
      </div>
    </div>

    <!-- 세션 수 -->
    <div class="approval-form-group">
      <label class="approval-form-label">총 세션 수<span class="required">*</span></label>
      <div class="session-preset-group">
        <button class="session-preset-btn" onclick="setApprovalSessions(this,10)">10회</button>
        <button class="session-preset-btn" onclick="setApprovalSessions(this,20)">20회</button>
        <button class="session-preset-btn" onclick="setApprovalSessions(this,30)">30회</button>
        <input type="number" id="approvalSessions" class="approval-input session-preset-input" placeholder="직접입력" min="1" oninput="clearSessionPreset()" style="width:90px;">
      </div>
    </div>

    <!-- 요일 -->
    <div class="approval-form-group">
      <label class="approval-form-label">PT 요일<span class="required">*</span></label>
      <div class="day-toggle-group">
        <label class="day-toggle"><input type="checkbox" name="approvalDay" value="월"><span>월</span></label>
        <label class="day-toggle"><input type="checkbox" name="approvalDay" value="화"><span>화</span></label>
        <label class="day-toggle"><input type="checkbox" name="approvalDay" value="수"><span>수</span></label>
        <label class="day-toggle"><input type="checkbox" name="approvalDay" value="목"><span>목</span></label>
        <label class="day-toggle"><input type="checkbox" name="approvalDay" value="금"><span>금</span></label>
        <label class="day-toggle"><input type="checkbox" name="approvalDay" value="토"><span>토</span></label>
        <label class="day-toggle"><input type="checkbox" name="approvalDay" value="일"><span>일</span></label>
      </div>
    </div>

    <!-- 시간 -->
    <div class="approval-form-group">
      <label class="approval-form-label">PT 시간<span class="required">*</span></label>
      <select id="approvalTime" class="approval-input">
        <option value="">시간 선택</option>
        <option>09:00</option><option>09:30</option>
        <option>10:00</option><option>10:30</option>
        <option>11:00</option><option>11:30</option>
        <option>12:00</option><option>12:30</option>
        <option>13:00</option><option>13:30</option>
        <option>14:00</option><option>14:30</option>
        <option>15:00</option><option>15:30</option>
        <option>16:00</option><option>16:30</option>
        <option>17:00</option><option>17:30</option>
        <option>18:00</option><option>18:30</option>
        <option>19:00</option><option>19:30</option>
        <option>20:00</option><option>20:30</option>
        <option>21:00</option>
      </select>
    </div>

    <!-- 시작일 -->
    <div class="approval-form-group">
      <label class="approval-form-label">시작일<span class="required">*</span></label>
      <input type="date" id="approvalStartDate" class="approval-input">
    </div>

    <!-- 금액 -->
    <div class="approval-form-group">
      <label class="approval-form-label">PT 금액 (원)</label>
      <input type="number" id="approvalAmount" class="approval-input" placeholder="예: 300000" min="0">
    </div>

    <!-- 메모 -->
    <div class="approval-form-group">
      <label class="approval-form-label">메모</label>
      <textarea id="approvalMemo" class="approval-input" rows="2" placeholder="특이사항, 목표 등" style="resize:vertical;font-family:inherit;"></textarea>
    </div>

    <div class="approval-modal-footer">
      <button class="approval-cancel-btn" onclick="closeApprovalModal()">취소</button>
      <button class="approval-submit-btn" id="approvalSubmitBtn" onclick="submitApproval()">
        <span>✓</span> PT 등록 승인
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/trainer.js"></script>
</body>
</html>
