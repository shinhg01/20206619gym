<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아이언핏 GYM - 기구 사용법</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ── 검색 + 필터 바 ── */
    .search-filter-bar {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }
    .search-input-wrap {
      position: relative;
      flex: 1;
      min-width: 200px;
    }
    .search-input-wrap i {
      position: absolute;
      left: 1rem; top: 50%;
      transform: translateY(-50%);
      color: #9CA3AF;
      font-size: 1rem;
    }
    .search-input-wrap input {
      width: 100%;
      padding: 0.65rem 1rem 0.65rem 2.6rem;
    }

    /* ── 카테고리 탭 ── */
    .cat-tab-wrap {
      overflow-x: auto;
      scrollbar-width: none;
      margin-bottom: 1.5rem;
    }
    .cat-tab-wrap::-webkit-scrollbar { display: none; }
    .cat-tabs {
      display: flex;
      gap: 0.5rem;
      min-width: max-content;
    }
    .cat-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      border-radius: 99px;
      border: 2px solid var(--border-color);
      background: var(--bg-card);
      color: var(--color-text-muted);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
      white-space: nowrap;
    }
    .cat-btn:hover { border-color: var(--color-primary); color: var(--color-primary); }
    .cat-btn.active {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: #FFF;
      box-shadow: 0 4px 12px rgba(232,89,60,0.3);
    }
    .cat-btn .cat-count {
      background: rgba(0,0,0,0.08);
      border-radius: 99px;
      padding: 1px 6px;
      font-size: 0.72rem;
    }
    .cat-btn.active .cat-count { background: rgba(255,255,255,0.25); }

    /* ── 기구 카드 그리드 ── */
    .equip-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.1rem;
    }
    .equip-card {
      background: var(--bg-card);
      border-radius: 14px;
      border: 1.5px solid var(--border-color);
      overflow: hidden;
      cursor: pointer;
      transition: all var(--transition-normal);
      display: flex;
      flex-direction: column;
    }
    .equip-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-premium);
      border-color: var(--color-primary);
    }
    .equip-card-top {
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      position: relative;
    }
    .equip-card-body {
      padding: 0.85rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .equip-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--color-text-primary);
      line-height: 1.3;
    }
    .equip-muscle {
      font-size: 0.72rem;
      color: var(--color-text-muted);
    }
    .equip-card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 0.5rem;
    }

    /* 난이도 점 */
    .diff-dots { display: flex; gap: 3px; align-items: center; }
    .ddot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--border-color);
      transition: background 0.2s;
    }
    .ddot.on { background: var(--color-primary); }
    .ddot.on.lv2 { background: #F59E0B; }
    .ddot.on.lv3 { background: var(--color-danger); }

    /* 상태 뱃지 */
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      display: inline-block; margin-right: 3px;
    }

    /* 결과 없음 */
    .no-result {
      grid-column: 1/-1;
      text-align: center;
      padding: 3rem;
      color: var(--color-text-muted);
    }
    .no-result i { font-size: 2.5rem; opacity: 0.3; display: block; margin-bottom: 0.75rem; }

    /* ── 기구 상세 모달 ── */
    .equip-modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 10000;
      display: flex; align-items: center; justify-content: center;
      padding: 1rem;
    }
    .equip-modal {
      background: var(--bg-card);
      border-radius: 20px;
      width: 100%; max-width: 680px;
      max-height: 90vh;
      display: flex; flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,0.45);
      animation: slideDown 0.28s ease-out;
    }
    .equip-modal-header {
      display: flex; align-items: center; gap: 1rem;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }
    .equip-modal-icon {
      width: 52px; height: 52px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }
    .equip-modal-body {
      flex: 1; overflow-y: auto;
      padding: 1.5rem;
      display: flex; flex-direction: column; gap: 1.25rem;
    }

    /* 유튜브 임베드 */
    .youtube-wrap {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }
    .youtube-wrap iframe {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }
    .youtube-placeholder {
      position: relative;
      padding-bottom: 40%;
      height: 0;
      border-radius: 12px;
      overflow: hidden;
      background: var(--bg-secondary);
      display: flex; align-items: center; justify-content: center;
    }
    .youtube-placeholder > div {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: var(--color-text-muted); gap: 0.5rem;
    }

    /* 운동방법 */
    .method-step {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.88rem;
    }
    .method-step:last-child { border-bottom: none; }
    .step-num {
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--color-primary);
      color: #FFF;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.72rem; font-weight: 700;
      flex-shrink: 0;
    }

    /* 주의사항 */
    .caution-box {
      background: #FFF7ED;
      border: 1.5px solid #FED7AA;
      border-radius: 10px;
      padding: 0.85rem 1rem;
      font-size: 0.85rem;
      color: #92400E;
      display: flex;
      gap: 0.5rem;
      align-items: flex-start;
    }
    .caution-box i { color: #F59E0B; flex-shrink: 0; margin-top: 2px; }

    /* 정보 태그 행 */
    .info-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }

    @keyframes slideDown { from { opacity:0; transform:translateY(-12px); } to { opacity:1; transform:translateY(0); } }

    @media (max-width: 1024px) { .equip-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 768px)  { .equip-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px)  { .equip-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="app-container">

  <!-- ── 사이드바 ── -->
  <aside class="sidebar" id="appSidebar">
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-icon"><i class="fa-solid fa-dumbbell"></i></span>
        <span class="logo-text">IRONFIT <span class="logo-highlight">GYM</span></span>
      </div>
    </div>
    <div class="sidebar-body">
      <ul class="nav-list">
        <li class="nav-item"><a href="dashboard.html"><i class="fa-solid fa-chart-line"></i><span>대시보드</span></a></li>
        <li class="nav-item"><a href="workout.html"><i class="fa-solid fa-calendar-check"></i><span>운동 기록</span></a></li>
        <li class="nav-item"><a href="body.html"><i class="fa-solid fa-weight-scale"></i><span>신체 변화</span></a></li>
        <li class="nav-item"><a href="diet.html"><i class="fa-solid fa-utensils"></i><span>식단 기록</span></a></li>
        <li class="nav-item active"><a href="equipment.html"><i class="fa-solid fa-circle-info"></i><span>기구 사용법</span></a></li>
        <li class="nav-item"><a href="pt.html"><i class="fa-solid fa-handshake"></i><span>PT 신청·일정</span></a></li>
        <li class="nav-item role-trainer" style="display:none;"><a href="trainer.html" style="border-left:3px solid var(--color-primary);"><i class="fa-solid fa-user-gear"></i><span>트레이너 관리</span></a></li>
        <li class="nav-item role-admin" style="display:none;"><a href="admin.html" style="border-left:3px solid var(--color-primary);"><i class="fa-solid fa-screwdriver-wrench"></i><span>시스템 관리자</span></a></li>
      </ul>
    </div>
    <div class="sidebar-footer">
      <div class="user-profile">
        <div class="user-avatar" id="userAvatar">H</div>
        <div class="user-info">
          <div class="user-name" id="profileName">홍길동</div>
          <div class="user-role" id="profileRole">일반회원</div>
        </div>
        <button class="btn-logout" id="logoutBtn" title="로그아웃">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ── 메인 콘텐츠 ── -->
  <div class="main-content">
    <header class="main-header">
      <div class="header-title">
        <i class="fa-solid fa-bars hamburger-btn" id="menuToggle"></i>
        <span>기구 사용법</span>
      </div>
      <div class="header-actions">
        <span class="badge badge-primary" id="resultCountBadge">0개</span>
      </div>
    </header>

    <main class="page-body">

      <!-- 검색 바 -->
      <div class="search-filter-bar">
        <div class="search-input-wrap">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" class="form-input" id="searchInput"
                 placeholder="운동명 또는 타겟 근육으로 검색..."
                 oninput="handleSearch(this.value)">
        </div>
      </div>

      <!-- 카테고리 탭 -->
      <div class="cat-tab-wrap">
        <div class="cat-tabs" id="catTabs"></div>
      </div>

      <!-- 기구 카드 그리드 -->
      <div class="equip-grid" id="equipGrid"></div>

    </main>
  </div>
</div>

<!-- ── 기구 상세 모달 ── -->
<div id="equipModalBackdrop" class="equip-modal-backdrop" style="display:none;" onclick="handleModalBackdrop(event)">
  <div class="equip-modal" onclick="event.stopPropagation()">

    <!-- 헤더 -->
    <div class="equip-modal-header">
      <div class="equip-modal-icon" id="modalIcon"></div>
      <div style="flex:1; min-width:0;">
        <div style="font-size:1.15rem; font-weight:800;" id="modalName"></div>
        <div style="font-size:0.82rem; color:var(--color-text-muted); margin-top:0.2rem;" id="modalMeta"></div>
      </div>
      <button class="btn btn-sm btn-secondary" onclick="closeEquipModal()">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <!-- 바디 -->
    <div class="equip-modal-body" id="modalBody"></div>

  </div>
</div>

<!-- 로딩 오버레이 -->
<div class="loading-overlay">
  <div class="spinner"></div>
  <div class="loading-text">기구 정보 불러오는 중...</div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/equipment.js"></script>
</body>
</html>
