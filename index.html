<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아이언핏 GYM - 로그인</title>
  <!-- FontAwesome for Premium Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Common Premium Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* 로그인 폼 필드 아이콘 레이아웃 보완 */
    .input-icon-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon-wrapper i {
      position: absolute;
      left: 1rem;
      color: #9CA3AF;
      transition: var(--transition-fast);
      font-size: 1.1rem;
    }
    .input-icon-wrapper .form-input {
      padding-left: 2.75rem;
    }
    .input-icon-wrapper .form-input:focus + i {
      color: var(--color-primary);
    }
    /* 서브 텍스트 및 저작권 안내 */
    .login-footer-text {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--color-text-muted);
    }
    /* 시범 로그인 섹션 */
    .demo-login-section {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .demo-login-label {
      text-align: center;
      font-size: 0.75rem;
      color: var(--color-text-muted);
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .demo-login-label::before,
    .demo-login-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.08);
    }
    .demo-btn-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
    }
    .demo-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      padding: 0.65rem 0.25rem;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      color: var(--color-text-secondary);
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .demo-btn:hover {
      border-color: var(--color-primary);
      background: rgba(232,89,60,0.1);
      color: var(--color-primary);
      transform: translateY(-1px);
    }
    .demo-btn i {
      font-size: 1.1rem;
    }
    .demo-btn .demo-btn-sub {
      font-size: 0.68rem;
      color: var(--color-text-muted);
      font-family: monospace;
    }
  </style>
</head>
<body class="login-page">

  <!-- Main Login Card Container -->
  <div class="login-card card">
    
    <!-- Branding Header -->
    <div class="login-logo">
      <div class="logo">
        <span class="logo-icon"><i class="fa-solid fa-dumbbell"></i></span>
        <span class="logo-text">IRONFIT <span class="logo-highlight">GYM</span></span>
      </div>
    </div>
    
    <!-- Form Body -->
    <div class="login-body">
      
      <!-- Inline Error Alert -->
      <div id="errorAlert" class="error-message">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="errorMessage">아이디 또는 비밀번호가 올바르지 않습니다.</span>
      </div>
      
      <!-- Login HTML Form -->
      <form id="loginForm" novalidate>
        
        <!-- User ID Input Group -->
        <div class="form-group">
          <label for="memberId" class="form-label required">사용자 ID</label>
          <div class="input-icon-wrapper">
            <input 
              type="text" 
              id="memberId" 
              name="memberId" 
              class="form-input" 
              placeholder="아이디를 입력하세요" 
              required
              autocomplete="username"
            >
            <i class="fa-solid fa-user"></i>
          </div>
        </div>
        
        <!-- Password Input Group -->
        <div class="form-group">
          <label for="password" class="form-label required">비밀번호</label>
          <div class="input-icon-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-input" 
              placeholder="비밀번호를 입력하세요" 
              required
              autocomplete="current-password"
            >
            <i class="fa-solid fa-lock"></i>
          </div>
        </div>
        
        <!-- Remember Me Checkbox (UX) -->
        <div class="form-group" style="margin-top: 1.5rem; margin-bottom: 2rem;">
          <label class="form-checkbox">
            <input type="checkbox" id="rememberMe">
            <span>아이디 저장</span>
          </label>
        </div>
        
        <!-- Action Button -->
        <button type="submit" class="btn btn-primary w-full btn-lg">
          로그인 <i class="fa-solid fa-right-to-bracket"></i>
        </button>
        
      </form>
      
      <!-- 시범 로그인 버튼 -->
      <div class="demo-login-section">
        <div class="demo-login-label">시범 로그인</div>
        <div class="demo-btn-group">
          <button type="button" class="demo-btn" onclick="demoLogin('M001','1234')">
            <i class="fa-solid fa-person-running"></i>
            회원 로그인
            <span class="demo-btn-sub">user / 1234</span>
          </button>
          <button type="button" class="demo-btn" onclick="demoLogin('T001','1234')">
            <i class="fa-solid fa-whistle"></i>
            트레이너 로그인
            <span class="demo-btn-sub">trainer / 1234</span>
          </button>
          <button type="button" class="demo-btn" onclick="demoLogin('admin','admin')">
            <i class="fa-solid fa-user-shield"></i>
            관리자 로그인
            <span class="demo-btn-sub">admin / admin</span>
          </button>
        </div>
      </div>

      <!-- Auxiliary footer info -->
      <div class="login-footer-text">
        <p>© 2026 IRONFIT GYM. All rights reserved.</p>
        <p style="font-size: 0.75rem; margin-top: 0.25rem; color: #9CA3AF;">비밀번호를 분실하신 경우 인포데스크로 문의 바랍니다.</p>
      </div>
      
    </div>
  </div>

  <!-- Central Loading Indicator Component -->
  <div class="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">로그인 정보 인증 중...</div>
  </div>

  <!-- Loading Core Scripts -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
